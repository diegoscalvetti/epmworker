- id: certificare
  start: 2020
  end: 2025
  topics: [bim]
  funder: "Brazilian National Agency of Petroleum, Natural Gas and Biofuels (ANP)"
  partners: "CERTI Foundation, Petrobras"
  en:
    title: "Certificare 1 & 2: digital commissioning"
    role: "Co-principal investigator"
    summary: "Digital transformation of commissioning and inspection processes for oil and gas plants, with process models, linked data and generative AI reporting."
    body: |
      Two consecutive R&D projects with a combined budget of about USD 5 million. They moved commissioning procedures from paper to process-oriented digital workflows, and led to publications on digital commissioning, linked sensor data and AI-assisted reporting.
  es:
    title: "Certificare 1 y 2: comisionamiento digital"
    role: "Co-investigador principal"
    summary: "Transformación digital de los procesos de comisionamiento e inspección de plantas de petróleo y gas, con modelos de procesos, datos enlazados e informes con IA generativa."
    body: |
      Dos proyectos consecutivos de I+D con un presupuesto conjunto cercano a USD 5 millones. Llevaron los procedimientos de comisionamiento del papel a flujos digitales orientados a procesos, y dieron origen a publicaciones sobre comisionamiento digital, datos de sensores enlazados e informes asistidos por IA.

- id: growingcircle
  start: 2020
  end: 2022
  topics: [dpp, digital-twin]
  funder: "EEA Grants 2014–2021 – Environment, Climate Change and Low Carbon Economy"
  partners: "Construction Institute (FEUP), NTNU"
  en:
    title: "GrowingCircle: integrated data for efficient and sustainable construction"
    role: "Researcher"
    summary: "Data templates, digital building logbooks and incremental digital twins to support circular construction."
    body: |
      GrowingCircle developed the incremental Digital Twin concept and data-template frameworks that link product data to circularity indicators across a building's life cycle.
  es:
    title: "GrowingCircle: datos integrados para una construcción eficiente y sostenible"
    role: "Investigador"
    summary: "Plantillas de datos, libros digitales del edificio y gemelos digitales incrementales para apoyar la construcción circular."
    body: |
      GrowingCircle desarrolló el concepto de Gemelo Digital incremental y marcos de plantillas de datos que vinculan la información de productos con indicadores de circularidad durante todo el ciclo de vida de un edificio.
