  en:
    title: "CoLAB 5.0"
    role: "Principal investigator"
    summary: "Digital tools to improve productivity, health and safety on construction sites, bringing together Chilean and international partners in a living lab at UC."
    body: |
      CoLAB 5.0 is a 12-month programme to develop and test digital tools for construction sites, with a focus on the people who do the work.

      It connects Electronic Performance Monitoring, Human-Data Interaction and incremental Digital Twins, and links the School of Civil Construction at UC with universities and companies in Europe and Latin America.
  es:
    title: "CoLAB 5.0"
    role: "Investigador principal"
    summary: "Herramientas digitales para mejorar la productividad, la salud y la seguridad en faena, reuniendo socios chilenos e internacionales en un laboratorio vivo en la UC."
    body: |
      CoLAB 5.0 es un programa de 12 meses para desarrollar y probar herramientas digitales en obras de construcción, con foco en las personas que ejecutan el trabajo.

      Conecta el Monitoreo Electrónico del Desempeño, la Interacción Humano-Datos y los Gemelos Digitales incrementales, y vincula a la Escuela de Construcción Civil UC con universidades y empresas de Europa y Latinoamérica.

- id: phd-epm-construction-workers
  start: 2017
  end: 2021
  topics: [epm]
  funder: "Faculty of Engineering, University of Porto (FEUP)"
  link: "https://repositorio-aberto.up.pt/handle/10216/134025"
  en:
    title: "PhD: Electronic Productivity Performance Monitoring of Construction Workers"
    role: "Doctoral researcher"
    summary: "Doctoral research that built the Worker 4.0 framework: sensors, process modelling and machine learning to measure craft workers' productivity on site."
    body: |
      The thesis studied how sensing technologies (real-time location systems, accelerometers and wearables) can measure what construction workers do, and how those measurements become useful key performance indicators.

      It combined laboratory circuit simulations, machine-learning activity classification and surveys of craft workers and engineers. It also identified Human-Data Interaction as a condition for using EPM responsibly.
  es:
    title: "Doctorado: Monitoreo Electrónico del Desempeño Productivo de Trabajadores de la Construcción"
    role: "Investigador doctoral"
    summary: "Investigación doctoral que dio origen al marco Worker 4.0: sensores, modelación de procesos y aprendizaje automático para medir la productividad de la mano de obra en faena."
    body: |
      La tesis estudió cómo las tecnologías de sensorización (sistemas de localización en tiempo real, acelerómetros y wearables) pueden medir lo que hacen los trabajadores de la construcción, y cómo esas mediciones se transforman en indicadores clave de desempeño útiles.

      Combinó simulaciones en circuito de laboratorio, clasificación de actividades con aprendizaje automático y encuestas a trabajadores e ingenieros. También identificó la Interacción Humano-Datos como condición para usar el EPM de forma responsable.

- id: worker-4-0
  start: 2015
  end: 2021
  topics: [epm]
  funder: "Self-funded venture"
  en:
    title: "Worker 4.0® methodology"
    role: "Founder and consultant"
    summary: "A methodology to evaluate workers' performance with electronic devices and wearable technologies, developed alongside real-time location consulting (LEAPS) and mobile apps."
    body: |
      Worker 4.0® packaged years of field work into a repeatable method: define the tasks, instrument the crew with wearables or location tags, and turn the data into productivity indicators that site managers can act on.

      The work ran in Brazil, Ireland and Portugal and fed directly into the doctoral research.
  es:
    title: "Metodología Worker 4.0®"
    role: "Fundador y consultor"
    summary: "Una metodología para evaluar el desempeño de los trabajadores con dispositivos electrónicos y tecnologías vestibles, desarrollada junto con consultoría en localización en tiempo real (LEAPS) y aplicaciones móviles."
    body: |
      Worker 4.0® convirtió años de trabajo en terreno en un método replicable: definir las tareas, equipar a la cuadrilla con wearables o etiquetas de localización y transformar los datos en indicadores de productividad que los jefes de obra puedan usar.

      El trabajo se desarrolló en Brasil, Irlanda y Portugal y alimentó directamente la investigación doctoral.

- id: beebadge
  start: 2011
  end: 2013
  topics: [epm]
  funder: "Sebrae-RS (Brazil), R&D public tender"
  partners: "Pheitec"
  en:
    title: "BEEBADGE: Electronic Performance Monitoring of craft workforce"
    role: "COO and partner director"
    summary: "An early RTLS-based system to monitor the productivity of construction and steel-fabrication crews, deployed in industry projects worth USD 2.6 million."
    body: |
      BEEBADGE and its sister product CtrlSteel used real-time location badges to follow work on industrial construction sites. It was one of the first practical EPM deployments in Brazilian construction and set the questions the later research tried to answer: what to measure, how accurately, and with what consent.
  es:
    title: "BEEBADGE: Monitoreo Electrónico del Desempeño de la mano de obra"
    role: "Director de operaciones y socio"
    summary: "Uno de los primeros sistemas basados en RTLS para monitorear la productividad de cuadrillas de construcción y fabricación metálica, implementado en proyectos industriales por USD 2,6 millones."
    body: |
      BEEBADGE y su producto hermano CtrlSteel usaban credenciales de localización en tiempo real para seguir el avance del trabajo en faenas industriales. Fue una de las primeras aplicaciones prácticas de EPM en la construcción brasileña y planteó las preguntas que la investigación posterior buscó responder: qué medir, con qué precisión y con qué consentimiento.

- id: msc-welders
  start: 2014
  end: 2016
  topics: [epm]
  funder: "Universidade Federal Fluminense (Brazil)"
  en:
    title: "MSc: electronic monitoring of welders' performance"
    role: "Master's researcher"
    summary: "Evaluation of an electronic methodology to monitor the performance of welders manufacturing pipe spools for refinery projects."
    body: |
      The master's thesis tested electronic monitoring in an industrial fabrication shop, comparing it with traditional measurement and identifying the factors that drive welders' labour productivity.
  es:
    title: "Magíster: monitoreo electrónico del desempeño de soldadores"
    role: "Investigador de magíster"
    summary: "Evaluación de una metodología electrónica para monitorear el desempeño de soldadores en la fabricación de spools de cañerías para proyectos de refinería."
    body: |
      La tesis de magíster probó el monitoreo electrónico en un taller de fabricación industrial, comparándolo con la medición tradicional e identificando los factores que determinan la productividad de los soldadores.

