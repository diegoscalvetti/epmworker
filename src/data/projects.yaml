- id: growingcircle
  start: 2020
  end: 2022
  topics: [dpp, digital-twin]
  funder: "EEA Grants 2014–2021 – Environment, Climate Change and Low Carbon Economy"
  partners: "Construction Institute (FEUP), NTNU"
  en:
    title: "GrowingCircle: integrated data for efficient and sustainable construction"
    role: "Researcher"
    summary: "Data templates, digital building logbooks and incremental digital twins to support circular construction."
    body: |
      GrowingCircle developed the incremental Digital Twin concept and data-template frameworks that link product data to circularity indicators across a building's life cycle.
  es:
    title: "GrowingCircle: datos integrados para una construcción eficiente y sostenible"
    role: "Investigador"
    summary: "Plantillas de datos, libros digitales del edificio y gemelos digitales incrementales para apoyar la construcción circular."
    body: |
      GrowingCircle desarrolló el concepto de Gemelo Digital incremental y marcos de plantillas de datos que vinculan la información de productos con indicadores de circularidad durante todo el ciclo de vida de un edificio.
